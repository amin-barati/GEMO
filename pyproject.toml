[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemo-tractography"
version = "0.1.0"
description = "Geometric & morphological deep learning classifier for tractography streamlines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Amin Barati" },
]
keywords = ["tractography", "diffusion-mri", "deep-learning", "neuroimaging", "streamlines"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.0",
    "numpy",
    "nibabel",
    "h5py",
    "tqdm",
    "scipy",
    "scikit-image",
]

[project.urls]
Homepage = "https://github.com/amin-barati/GEMO"
Repository = "https://github.com/amin-barati/GEMO"

[project.scripts]
gemo-train = "gemo.train:cli"
gemo-infer = "gemo.cli:main"

[tool.setuptools]
packages = ["gemo"]

[tool.setuptools.package-data]
gemo = ["checkpoints/*.pt", "checkpoints/*.json"]
